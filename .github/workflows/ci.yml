name: Full Stack CI

on:
  push:
    branches: [event-ui]
  pull_request:
    branches: [event-ui]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node (Frontend)
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Frontend
        run: npm ci

      - name: Build Frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node (Backend)
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Backend
        run: |
          cd backend
          npm ci

      - name: Check Backend Starts
        run: |
          cd backend
          node server.js &
          sleep 5